<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S HTML Minifier - Fast & Free Online Code Optimizer</title>
  
  <meta name="description" content="S HTML Minifier is a fast, lightweight, zero-database online tool to minify and optimize HTML code instantly. Built by Sgdev.">
  <meta name="keywords" content="HTML Minifier, Minify HTML, Online HTML Compressor, Code Optimizer, Sgdev, Shubhomoy">
  <meta name="author" content="Sgdev (Shubhomoy)">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="S HTML Minifier - Fast & Free Code Optimizer">
  <meta property="og:description" content="Minify your HTML code in seconds with S HTML Minifier. Free, lightweight, and open source.">
  <meta property="og:type" content="website">

  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #373c3c;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      padding: 15px;
      margin: 0;
    }

    /* রেসপন্সিভ টেক্সট-এরিয়া */
    textarea {
      width: 100%;
      max-width: 650px;
      height: 150px;
      color: #ff8c00;
      border: 2px solid #555555;
      background-color: #2b2e2e;
      border-radius: 8px;
      padding: 12px;
      outline: none;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
    }

    textarea:focus {
      border-color: #ff8c00;
    }

    /* ফ্লেক্সিবল বাটন কন্টেইনার */
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      transition: 0.2s opacity;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-minify {
      padding: 12px 24px;
      background-color: #ff8c00;
      color: #fff;
      font-size: 15px;
      margin: 10px 0;
    }

    .btn-copy {
      padding: 10px 18px;
      background-color: #25d366;
      color: #fff;
    }

    .btn-source {
      padding: 10px 18px;
      background-color: #5865f2;
      color: #fff;
    }

    /* মোবাইল স্ক্রিনের জন্য অ্যাডজাস্টমেন্ট */
    @media (max-width: 480px) {
      h2 {
        font-size: 20px;
      }
      
      textarea {
        height: 120px;
      }

      .btn-container button {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>

<body>

  <h2>🚀 S HTML Minifier</h2>

  <textarea id="rawHtml" placeholder="Paste your HTML code here..."></textarea><br>

  <button class="btn-minify" onclick="minifyCode()">
    Minify Now ⚡
  </button><br>

  <textarea id="minifiedHtml" placeholder="Your output minified version..." readonly></textarea><br>

  <div class="btn-container">
    <button class="btn-copy" onclick="copyCode()">
      📋 Copy Code
    </button>
    
    <a id="sourceBtn" href="https://github.com/sgdev-official" target="_blank" style="text-decoration: none;">
      <button class="btn-source">
        👁️ View Source Code
      </button>
    </a>
  </div>

  <footer style="margin-top: 30px; font-size: 13px; color: #aaaaaa;">
    <p>© 2026 <b>Sgdev (Shubhomoy)</b>. All Rights Reserved.</p>
    <p>This project is licensed under the <b>Apache License 2.0</b>.</p>
  </footer>

  <script>
    function minifyCode() {
      let input = document.getElementById('rawHtml').value;

      let minified = input
        .replace(/<!--[\s\S]*?-->/g, '')     
        .replace(/\s+/g, ' ')               
        .replace(/>\s+</g, '><')            
        .trim();                             

      document.getElementById('minifiedHtml').value = minified;
    }

    function copyCode() {
      let minifiedText = document.getElementById('minifiedHtml').value;
      if (minifiedText === "") {
        alert("Put the code first!");
        return;
      }
      
      navigator.clipboard.writeText(minifiedText);
      alert("Successfully code copied 🚀");
    }
  </script>

</body>
</html>
