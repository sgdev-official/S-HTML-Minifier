<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S HTML Minifier - Fast & Free Online Code Optimizer</title>
  
  <meta name="description" content="S HTML Minifier is a fast, lightweight, zero-database online tool to minify and optimize HTML code instantly. Built by Sgdev.">
  <meta name="keywords" content="HTML Minifier, Minify HTML, Online HTML Compressor, Code Optimizer, Sgdev, Shubhomoy">
  <meta name="author" content="Sgdev (Shubhomoy)">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="S HTML Minifier - Fast & Free Code Optimizer">
  <meta property="og:description" content="Minify your HTML code in seconds with S HTML Minifier. Free, lightweight, and open source.">
  <meta property="og:type" content="website">

  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    body {
      background-color: #373c3c;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    textarea {
      color: #ff8c00;
      border: 2px solid #555555;
      background-color: #2b2e2e;
      border-radius: 6px;
      padding: 10px;
      outline: none;
    }

    textarea:focus {
      border-color: #ff8c00;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>🚀 S HTML Minifier</h2>

  <textarea id="rawHtml" rows="8" cols="60" placeholder="Paste your HTML code here..."></textarea><br><br>

  <button onclick="minifyCode()" style="padding: 10px 20px; background-color: #ff8c00; color: #fff; font-weight: bold; border: none; border-radius: 5px;">
    Minify Now ⚡
  </button><br><br>

  <textarea id="minifiedHtml" rows="8" cols="60" placeholder="Your output minified version..." readonly></textarea><br><br>

  <div style="margin-top: 5px;">
    <button onclick="copyCode()" style="padding: 8px 16px; background-color: #25d366; color: #fff; border: none; border-radius: 4px; font-weight: bold;">
      📋 Copy Code
    </button>
    
    <a id="sourceBtn" href="https://github.com/sgdev-official/S-HTML-Minifier" target="_blank" style="text-decoration: none;">
      <button style="padding: 8px 16px; background-color: #5865f2; color: #fff; border: none; border-radius: 4px; font-weight: bold;">
        👁️ View Source Code
      </button>
    </a>
  </div>

  <footer style="margin-top: 25px; font-size: 13px; color: #aaaaaa;">
    <p>© 2026 <b>Sgdev (Shubhomoy)</b>. All Rights Reserved.</p>
    <p>This project is licensed under the <b>Apache License 2.0</b>.</p>
  </footer>

  <script>
    function minifyCode() {
      let input = document.getElementById('rawHtml').value;

      let minified = input
        .replace(/<!--[\s\S]*?-->/g, '')     
        .replace(/\s+/g, ' ')               
        .replace(/>\s+</g, '><')            
        .trim();                             

      document.getElementById('minifiedHtml').value = minified;
    }

    function copyCode() {
      let minifiedText = document.getElementById('minifiedHtml').value;
      if (minifiedText === "") {
        alert("Put the code first!");
        return;
      }
      
      navigator.clipboard.writeText(minifiedText);
      alert("Successfully code copied 🚀");
    }
  </script>

</body>
</html>
